<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POLICE WALA | SURVEILLANCE HQ</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #ffcc00;
            --police-red: #ff3131;
            --police-blue: #002244;
            --glass: rgba(15, 15, 15, 0.85);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: #000;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 3D Background System */
        .viewport {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            perspective: 1000px;
        }

        .scene {
            position: absolute;
            width: 110%; height: 110%;
            top: -5%; left: -5%;
            background: url('https://r2.erweima.ai/ai_image/95462057-0138-4e89-994f-01588667f66a.jpg') no-repeat center center;
            background-size: cover;
            transition: transform 0.1s ease-out;
            filter: brightness(0.7) contrast(1.1);
        }

        /* Animated Officer Clipping (Breathing/Talking Effect) */
        .officer {
            position: absolute;
            width: 100%; height: 100%;
            background: inherit;
            background-size: cover;
            background-position: center;
            pointer-events: none;
        }
        .off-1 { clip-path: inset(35% 70% 5% 15%); animation: breathe 3s infinite; }
        .off-2 { clip-path: inset(35% 55% 5% 30%); animation: breathe 4s infinite; }
        .off-3 { clip-path: inset(38% 45% 5% 42%); animation: breathe 3.5s infinite; }

        @keyframes breathe {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.02) translateY(-2px); filter: brightness(1.2); }
        }

        /* HUD Overlay */
        .hud {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.8) 100%);
            z-index: 2;
            pointer-events: none;
            border: 15px solid rgba(255,255,255,0.02);
        }

        /* Main Content */
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .title-h1 {
            font-family: 'Bebas Neue', cursive;
            font-size: clamp(2.5rem, 8vw, 5rem);
            color: var(--accent);
            line-height: 1;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .live-badge {
            background: var(--police-red);
            padding: 4px 10px;
            font-size: 10px;
            font-weight: bold;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 5px;
        }
        .live-badge::before { content: ''; width: 6px; height: 6px; background: #fff; border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }

        .clock-section { text-align: right; }
        #clock { font-family: 'Bebas Neue'; font-size: 1.8rem; color: var(--accent); }

        /* Quotes Card */
        .quote-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .quote-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--border);
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #quote-text { font-family: 'Special Elite'; font-size: clamp(1rem, 4vw, 1.4rem); color: #efefef; }

        /* SPOTIFY STYLE PLAYER */
        .spotify-player {
            background: linear-gradient(to top, rgba(0,0,0,1), rgba(0,0,0,0.8));
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px 20px 0 0;
            padding: 20px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .player-top { display: flex; align-items: center; gap: 15px; }
        .album-art { width: 50px; height: 50px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; box-shadow: 0 4px 15px rgba(255,204,0,0.3); }
        .track-info { flex: 1; min-width: 0; }
        #track-name { font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 1rem; }
        .track-sub { font-size: 12px; color: #aaa; }

        .player-controls { display: flex; align-items: center; justify-content: center; gap: 25px; }
        .p-btn { background: none; border: none; color: #fff; font-size: 1.4rem; cursor: pointer; transition: 0.2s; }
        .p-btn:hover { color: var(--accent); transform: scale(1.1); }
        .btn-main { background: #fff; color: #000; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }

        .progress-container { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; position: relative; }
        #progress-bar { height: 100%; background: var(--accent); width: 0%; border-radius: 2px; }

        .bottom-tools { display: flex; align-items: center; justify-content: space-between; }
        .volume-group { display: flex; align-items: center; gap: 10px; flex: 1; max-width: 200px; }
        input[type="range"] { flex: 1; height: 4px; accent-color: var(--accent); cursor: pointer; }

        /* Desktop View adjustments */
        @media (min-width: 768px) {
            .spotify-player { flex-direction: row; border-radius: 20px; margin-bottom: 10px; padding: 15px 30px; }
            .player-top { width: 300px; }
            .progress-container { position: absolute; top: -2px; left: 0; }
            .bottom-tools { flex: 0; }
        }

        /* Mobile View adjustments */
        @media (max-width: 600px) {
            .spotify-player { padding: 15px; border-radius: 25px 25px 0 0; }
            .quote-area { display: none; }
            header { background: rgba(0,0,0,0.4); padding: 10px; border-radius: 10px; }
            .title-h1 { font-size: 2.2rem; }
        }

        /* Siren Flash */
        #siren-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; opacity: 0; transition: 0.2s; }
        .siren-active { animation: siren-flash 0.4s infinite; opacity: 1 !important; }
        @keyframes siren-flash { 0%, 100% { background: rgba(255, 0, 0, 0.2); } 50% { background: rgba(0, 0, 255, 0.2); } }
    </style>
</head>
<body>

    <div id="siren-overlay"></div>
    <div class="hud"></div>

    <div class="viewport">
        <div class="scene" id="scene">
            <div class="officer off-1"></div>
            <div class="officer off-2"></div>
            <div class="officer off-3"></div>
        </div>
    </div>

    <div class="content">
        <header>
            <div class="branding">
                <h1 class="title-h1">POLICE WALA</h1>
                <div class="live-badge">UP-32 SURVEILLANCE</div>
            </div>
            <div class="clock-section">
                <div id="clock">00:00:00</div>
                <div style="font-size: 10px; opacity: 0.6;">HQ CONNECTED</div>
            </div>
        </header>

        <div class="quote-area">
            <div class="quote-card">
                <p id="quote-text">"साहब, ये थाना है, यहाँ कानून चलता है।"</p>
            </div>
        </div>

        <!-- Spotify Style Mobile Player -->
        <footer class="spotify-player">
            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>

            <div class="player-top">
                <div class="album-art">🚔</div>
                <div class="track-info">
                    <div id="track-name">वायरलेस कनेक्ट हो रहा है...</div>
                    <div class="track-sub">मुख्यालय कंट्रोल रूम • लाइव</div>
                </div>
                <button class="p-btn" onclick="triggerSiren()" style="font-size: 1.2rem;">🚨</button>
            </div>

            <div class="player-controls">
                <button class="p-btn" onclick="prev()">⏮</button>
                <button class="p-btn btn-main" id="playBtn" onclick="togglePlay()">▶</button>
                <button class="p-btn" onclick="next()">⏭</button>
            </div>

            <div class="bottom-tools">
                <div class="volume-group">
                    <span style="font-size: 12px;">🔈</span>
                    <input type="range" id="volSlider" min="0" max="100" value="70" oninput="setVol(this.value)">
                    <span style="font-size: 12px;">🔊</span>
                </div>
                <div style="font-size: 10px; opacity: 0.5; font-weight: bold; margin-left: 10px;">VOL: <span id="volLabel">70</span>%</div>
            </div>
        </footer>
    </div>

    <div id="yt-player" style="display:none"></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // 3D Parallax for Desktop
        const scene = document.getElementById('scene');
        document.addEventListener('mousemove', (e) => {
            if(window.innerWidth > 768) {
                const x = (window.innerWidth / 2 - e.pageX) / 45;
                const y = (window.innerHeight / 2 - e.pageY) / 45;
                scene.style.transform = `rotateY(${x}deg) rotateX(${-y}deg) scale(1.05)`;
            }
        });

        // Clock & Quotes
        const quotes = [
            "\"साहब, ये थाना है, यहाँ कानून चलता है।\"",
            "\"कानून के हाथ बहुत लंबे होते हैं!\"",
            "\"वर्दी की शान, देश की आन।\"",
            "\"Main yahaan insaaf karne aaya hoon.\"",
            "\"Duty is the only religion.\"",
            "\"Wireless Check: One-Two, Over.\""
        ];
        let qIdx = 0;
        setInterval(() => {
            const q = document.getElementById('quote-text');
            q.style.opacity = 0;
            setTimeout(() => {
                qIdx = (qIdx + 1) % quotes.length;
                q.innerText = quotes[qIdx];
                q.style.opacity = 1;
            }, 500);
        }, 5000);

        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        // YouTube Logic
        let player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '0', width: '0',
                playerVars: { listType: 'playlist', list: 'PLIqporl42Kfc' },
                events: {
                    'onReady': (e) => { player.setVolume(70); },
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            const btn = document.getElementById('playBtn');
            const name = document.getElementById('track-name');
            if (event.data == YT.PlayerState.PLAYING) {
                btn.innerText = "⏸";
                name.innerText = player.getVideoData().title;
                updateProgressBar();
            } else {
                btn.innerText = "▶";
            }
        }

        function updateProgressBar() {
            setInterval(() => {
                if (player && player.getCurrentTime) {
                    const perc = (player.getCurrentTime() / player.getDuration()) * 100;
                    document.getElementById('progress-bar').style.width = perc + "%";
                }
            }, 1000);
        }

        function togglePlay() {
            if(player.getPlayerState() == 1) player.pauseVideo();
            else player.playVideo();
        }
        function next() { player.nextVideo(); }
        function prev() { player.previousVideo(); }
        function setVol(v) { 
            player.setVolume(v); 
            document.getElementById('volLabel').innerText = v;
        }

        function triggerSiren() {
            const s = document.getElementById('siren-overlay');
            s.classList.add('siren-active');
            setTimeout(() => s.classList.remove('siren-active'), 4000);
        }

        window.addEventListener('keydown', (e) => {
            if(e.code === 'Space') { e.preventDefault(); triggerSiren(); }
        });
    </script>
</body>
</html>
