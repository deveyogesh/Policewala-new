<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POLICE WALA | SURVEILLANCE HQ</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #ffcc00;
            --police-red: #ff3131;
            --police-blue: #002244;
            --glass: rgba(10, 10, 10, 0.85);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: #000;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 3D Background System */
        .viewport {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            perspective: 1000px;
        }

        .scene {
            position: absolute;
            width: 110%; height: 110%;
            top: -5%; left: -5%;
            background: url('https://i.ibb.co/TVbsXYT/file-0000000094cc81faae063fad08d95e73.png') no-repeat center center;
            background-size: cover;
            transition: transform 0.1s ease-out;
            filter: brightness(0.6) contrast(1.1);
        }

        /* Animated Officer Clipping */
        .officer {
            position: absolute;
            width: 100%; height: 100%;
            background: inherit;
            background-size: cover;
            background-position: center;
            pointer-events: none;
        }
        .off-1 { clip-path: inset(35% 70% 5% 15%); animation: breathe 3s infinite; }
        .off-2 { clip-path: inset(35% 55% 5% 30%); animation: breathe 4s infinite; }
        .off-3 { clip-path: inset(38% 45% 5% 42%); animation: breathe 3.5s infinite; }

        @keyframes breathe {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.02) translateY(-2px); filter: brightness(1.2); }
        }

        .hud {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.8) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* Main Content Layout */
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            padding: 15px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding-top: 10px;
        }

        .title-h1 {
            font-family: 'Bebas Neue', cursive;
            font-size: clamp(2rem, 8vw, 5rem);
            color: var(--accent);
            line-height: 1;
        }

        .live-badge {
            background: var(--police-red);
            padding: 3px 8px;
            font-size: 9px;
            font-weight: bold;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 5px;
            text-transform: uppercase;
        }
        .live-badge::before { content: ''; width: 6px; height: 6px; background: #fff; border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }

        #clock { font-family: 'Bebas Neue'; font-size: 1.5rem; color: var(--accent); text-align: right; }

        /* Quotes Card - Optimized for Mobile visibility */
        .quote-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            z-index: 11;
        }

        .quote-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            padding: 18px;
            border-radius: 12px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        #quote-text { 
            font-family: 'Special Elite'; 
            font-size: clamp(0.95rem, 4.5vw, 1.3rem); 
            color: #fff; 
            line-height: 1.5;
            transition: opacity 0.5s;
        }

        /* SPOTIFY STYLE PLAYER */
        .spotify-player {
            background: linear-gradient(to top, #000, rgba(0,0,0,0.9));
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px 20px 0 0;
            padding: 15px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .player-top { display: flex; align-items: center; gap: 12px; }
        .album-art { 
            width: 45px; height: 45px; 
            background: var(--accent); 
            border-radius: 6px; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 1.2rem; 
            box-shadow: 0 4px 15px rgba(255,204,0,0.3); 
        }
        .track-info { flex: 1; min-width: 0; }
        #track-name { font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.9rem; }
        .track-sub { font-size: 11px; color: #aaa; }

        .player-controls { display: flex; align-items: center; justify-content: center; gap: 20px; }
        .p-btn { background: none; border: none; color: #fff; font-size: 1.3rem; cursor: pointer; }
        .btn-main { background: #fff; color: #000; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }

        .progress-container { width: 100%; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; }
        #progress-bar { height: 100%; background: var(--accent); width: 0%; border-radius: 2px; transition: width 0.3s; }

        .bottom-tools { display: flex; align-items: center; justify-content: space-between; padding-top: 5px; }
        .volume-group { display: flex; align-items: center; gap: 8px; flex: 1; max-width: 180px; }
        input[type="range"] { flex: 1; height: 3px; accent-color: var(--accent); cursor: pointer; }

        @media (min-width: 768px) {
            .spotify-player { flex-direction: row; border-radius: 15px; margin-bottom: 10px; padding: 12px 25px; }
            .player-top { width: 280px; }
            .progress-container { position: absolute; top: -1px; left: 0; height: 4px; }
            .bottom-tools { flex: 0; min-width: 150px; }
        }

        /* Siren Flash */
        #siren-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; opacity: 0; }
        .siren-active { animation: siren-flash 0.4s infinite; opacity: 1 !important; }
        @keyframes siren-flash { 0%, 100% { background: rgba(255, 0, 0, 0.25); } 50% { background: rgba(0, 0, 255, 0.25); } }
    </style>
</head>
<body>

    <!-- Siren Flash Overlay -->
    <div id="siren-overlay"></div>
    <div class="hud"></div>

    <div class="viewport">
        <div class="scene" id="scene">
            <div class="officer off-1"></div>
            <div class="officer off-2"></div>
            <div class="officer off-3"></div>
        </div>
    </div>

    <div class="content">
        <header>
            <div class="branding">
                <h1 class="title-h1">POLICE WALA</h1>
                <div class="live-badge">UP-32 SURVEILLANCE HQ</div>
            </div>
            <div class="clock-section">
                <div id="clock">00:00:00</div>
                <div style="font-size: 9px; opacity: 0.6; text-align: right;">HQ CONNECTED</div>
            </div>
        </header>

        <!-- Quotes Section (Now Visible on Mobile) -->
        <div class="quote-area">
            <div class="quote-card">
                <p id="quote-text">"साहब, ये थाना है, यहाँ कानून चलता है।"</p>
            </div>
        </div>

        <!-- Spotify Inspired Player -->
        <footer class="spotify-player">
            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>

            <div class="player-top">
                <div class="album-art">🚔</div>
                <div class="track-info">
                    <div id="track-name">वायरलेस सिग्नल ढूँढ रहे हैं...</div>
                    <div class="track-sub">मुख्यालय कंट्रोल रूम • लाइव फीड</div>
                </div>
                <!-- SIREN BUTTON -->
                <button class="p-btn" onclick="triggerSiren()">🚨</button>
            </div>

            <div class="player-controls">
                <button class="p-btn" onclick="prev()">⏮</button>
                <button class="p-btn btn-main" id="playBtn" onclick="togglePlay()">▶</button>
                <button class="p-btn" onclick="next()">⏭</button>
            </div>

            <div class="bottom-tools">
                <div class="volume-group">
                    <span style="font-size: 10px;">🔈</span>
                    <input type="range" id="volSlider" min="0" max="100" value="70" oninput="setVol(this.value)">
                    <span style="font-size: 10px;">🔊</span>
                </div>
                <div style="font-size: 10px; font-weight: bold; margin-left: 8px;"><span id="volLabel">70</span>%</div>
            </div>
        </footer>
    </div>

    <div id="yt-player" style="display:none"></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // SIREN AUDIO SETUP
        const sirenAudio = new Audio('https://www.soundjay.com/mechanical/sounds/siren-1.mp3');
        sirenAudio.loop = true;

        function triggerSiren() {
            const s = document.getElementById('siren-overlay');
            if (s.classList.contains('siren-active')) {
                s.classList.remove('siren-active');
                sirenAudio.pause();
                sirenAudio.currentTime = 0;
            } else {
                s.classList.add('siren-active');
                sirenAudio.play().catch(e => console.log("Click the page first to enable sound."));
                
                // Auto stop after 5 seconds to match the vibe
                setTimeout(() => {
                    s.classList.remove('siren-active');
                    sirenAudio.pause();
                    sirenAudio.currentTime = 0;
                }, 5000);
            }
        }

        // 3D Parallax for Desktop
        const scene = document.getElementById('scene');
        document.addEventListener('mousemove', (e) => {
            if(window.innerWidth > 768) {
                const x = (window.innerWidth / 2 - e.pageX) / 50;
                const y = (window.innerHeight / 2 - e.pageY) / 50;
                scene.style.transform = `rotateY(${x}deg) rotateX(${-y}deg) scale(1.05)`;
            }
        });

        // Quotes Animation
        const quotes = [
            "\"साहब, ये थाना है, यहाँ कानून चलता है।\"",
            "\"कानून के हाथ बहुत लंबे होते हैं!\"",
            "\"वर्दी की शान, देश की आन।\"",
            "\"Main yahaan insaaf karne aaya hoon.\"",
            "\"Duty is the only religion.\"",
            "\"Ae Shana, gaadi side mein lo!\"",
            "\"Wireless Check: One-Two, Over.\""
        ];
        let qIdx = 0;
        setInterval(() => {
            const q = document.getElementById('quote-text');
            q.style.opacity = 0;
            setTimeout(() => {
                qIdx = (qIdx + 1) % quotes.length;
                q.innerText = quotes[qIdx];
                q.style.opacity = 1;
            }, 500);
        }, 5000);

        // Clock Update
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        // YouTube Audio Engine
        let player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '0', width: '0',
                playerVars: { listType: 'playlist', list: 'PLIqporl42Kfc' },
                events: {
                    'onReady': (e) => { player.setVolume(70); },
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            const btn = document.getElementById('playBtn');
            const name = document.getElementById('track-name');
            if (event.data == YT.PlayerState.PLAYING) {
                btn.innerText = "⏸";
                name.innerText = player.getVideoData().title;
                updateProgress();
            } else {
                btn.innerText = "▶";
            }
        }

        function updateProgress() {
            setInterval(() => {
                if (player && player.getCurrentTime) {
                    const perc = (player.getCurrentTime() / player.getDuration()) * 100;
                    document.getElementById('progress-bar').style.width = perc + "%";
                }
            }, 1000);
        }

        function togglePlay() {
            if(player.getPlayerState() == 1) player.pauseVideo();
            else player.playVideo();
        }
        function next() { player.nextVideo(); }
        function prev() { player.previousVideo(); }
        function setVol(v) { 
            player.setVolume(v); 
            document.getElementById('volLabel').innerText = v;
        }

        // Spacebar Shortcut for Siren
        window.addEventListener('keydown', (e) => {
            if(e.code === 'Space') { e.preventDefault(); triggerSiren(); }
        });
    </script>
</body>
</html>
