<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POLICE WALA | SURVEILLANCE HQ</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #ffcc00;
            --police-red: #ff3131;
            --police-blue: #002244;
            --glass: rgba(10, 10, 10, 0.9);
            --border: rgba(255, 255, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: #000;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 3D Background */
        .viewport {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            perspective: 1000px;
        }

        .scene {
            position: absolute;
            width: 110%; height: 110%;
            top: -5%; left: -5%;
            background: url('https://i.ibb.co/TVbsXYT/file-0000000094cc81faae063fad08d95e73.png') no-repeat center center;
            background-size: cover;
            filter: brightness(0.6) contrast(1.1);
            transition: transform 0.1s ease-out;
        }

        .officer {
            position: absolute;
            width: 100%; height: 100%;
            background: inherit;
            background-size: cover;
            background-position: center;
            pointer-events: none;
        }
        .off-1 { clip-path: inset(35% 70% 5% 15%); animation: breathe 3s infinite; }
        .off-2 { clip-path: inset(35% 55% 5% 30%); animation: breathe 4s infinite; }
        .off-3 { clip-path: inset(38% 45% 5% 42%); animation: breathe 3.5s infinite; }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02) translateY(-2px); }
        }

        .hud {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.8) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* UI Elements */
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            padding: 15px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .title-h1 {
            font-family: 'Bebas Neue', cursive;
            font-size: clamp(2rem, 8vw, 4.5rem);
            color: var(--accent);
            line-height: 1;
        }

        .live-badge {
            background: var(--police-red);
            padding: 4px 10px;
            font-size: 10px;
            font-weight: bold;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 5px;
            text-transform: uppercase;
        }
        .live-badge::before { content: ''; width: 6px; height: 6px; background: #fff; border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }

        #clock { font-family: 'Bebas Neue'; font-size: 1.5rem; color: var(--accent); }

        .quote-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .quote-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--border);
            text-align: center;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        #quote-text { font-family: 'Special Elite'; font-size: 1.1rem; color: #fff; line-height: 1.4; }

        /* SPOTIFY PLAYER UI */
        .spotify-player {
            background: linear-gradient(to top, #000, rgba(15,15,15,0.95));
            backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            border-radius: 25px 25px 0 0;
            padding: 20px;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .player-top { display: flex; align-items: center; gap: 15px; }
        .album-art { width: 50px; height: 50px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; box-shadow: 0 5px 15px rgba(255,204,0,0.3); }
        .track-info { flex: 1; min-width: 0; }
        #track-name { font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 1rem; }
        .track-sub { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }

        .player-controls { display: flex; align-items: center; justify-content: center; gap: 25px; }
        .p-btn { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; transition: 0.2s; }
        .btn-main { background: #fff; color: #000; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; box-shadow: 0 0 15px rgba(255,255,255,0.2); }
        .p-btn:hover { color: var(--accent); transform: scale(1.1); }

        .progress-container { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; }
        #progress-bar { height: 100%; background: var(--accent); width: 0%; border-radius: 2px; transition: width 0.3s linear; }

        .volume-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 5px 0;
        }

        input[type="range"] {
            flex: 1;
            max-width: 250px;
            height: 4px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        #volLabel { font-size: 11px; font-weight: bold; min-width: 30px; color: var(--accent); }

        /* Desktop specific layout */
        @media (min-width: 768px) {
            .spotify-player { flex-direction: row; border-radius: 20px; padding: 15px 30px; margin-bottom: 10px; }
            .player-top { width: 300px; }
            .volume-section { width: 250px; border-left: 1px solid var(--border); padding-left: 20px; }
            .progress-container { position: absolute; top: -1px; left: 0; }
        }

        /* Siren Effect */
        #siren-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; opacity: 0; }
        .siren-active { animation: siren-flash 0.4s infinite; opacity: 1 !important; }
        @keyframes siren-flash { 0%, 100% { background: rgba(255, 0, 0, 0.2); } 50% { background: rgba(0, 0, 255, 0.2); } }
    </style>
</head>
<body>

    <div id="siren-overlay"></div>
    <div class="hud"></div>

    <div class="viewport">
        <div class="scene" id="scene">
            <div class="officer off-1"></div>
            <div class="officer off-2"></div>
            <div class="officer off-3"></div>
        </div>
    </div>

    <div class="content">
        <header>
            <div class="branding">
                <h1 class="title-h1">POLICE WALA</h1>
                <div class="live-badge">UP-32 HQ SURVEILLANCE</div>
            </div>
            <div class="clock-section">
                <div id="clock">00:00:00</div>
            </div>
        </header>

        <div class="quote-area">
            <div class="quote-card">
                <p id="quote-text">"साहब, ये थाना है, यहाँ कानून चलता है।"</p>
            </div>
        </div>

        <footer class="spotify-player">
            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>

            <div class="player-top">
                <div class="album-art">🚔</div>
                <div class="track-info">
                    <div id="track-name">वायरलेस कनेक्ट हो रहा है...</div>
                    <div class="track-sub">HQ Control Room • Live</div>
                </div>
                <button class="p-btn" onclick="triggerSiren()">🚨</button>
            </div>

            <div class="player-controls">
                <button class="p-btn" onclick="prev()">⏮</button>
                <button class="p-btn btn-main" id="playBtn" onclick="togglePlay()">▶</button>
                <button class="p-btn" onclick="next()">⏭</button>
            </div>

            <div class="volume-section">
                <span style="font-size: 12px;">🔈</span>
                <input type="range" id="volSlider" min="0" max="100" value="70" oninput="setVol(this.value)">
                <span id="volLabel">70%</span>
            </div>
        </footer>
    </div>

    <div id="yt-player" style="display:none"></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // SIREN AUDIO (Direct Link to a clear MP3)
        const sirenSound = new Audio('https://www.soundjay.com/mechanical/sounds/siren-1.mp3');
        sirenSound.loop = true;

        function triggerSiren() {
            const overlay = document.getElementById('siren-overlay');
            if (overlay.classList.contains('siren-active')) {
                overlay.classList.remove('siren-active');
                sirenSound.pause();
                sirenSound.currentTime = 0;
            } else {
                overlay.classList.add('siren-active');
                sirenSound.play().catch(() => alert("Click Play first to enable audio!"));
                
                // Auto stop after 6 seconds
                setTimeout(() => {
                    overlay.classList.remove('siren-active');
                    sirenSound.pause();
                }, 6000);
            }
        }

        // Parallax Effect
        const scene = document.getElementById('scene');
        document.addEventListener('mousemove', (e) => {
            if(window.innerWidth > 768) {
                const x = (window.innerWidth / 2 - e.pageX) / 50;
                const y = (window.innerHeight / 2 - e.pageY) / 50;
                scene.style.transform = `rotateY(${x}deg) rotateX(${-y}deg) scale(1.05)`;
            }
        });

        // Quotes
        const quotes = [
            "\"साहब, ये थाना है, यहाँ कानून चलता है।\"",
            "\"कानून के हाथ बहुत लंबे होते हैं!\"",
            "\"Main yahaan insaaf karne aaya hoon.\"",
            "\"वर्दी की शान, देश की आन।\"",
            "\"Wireless Check: One-Two, Over.\"",
            "\"Ae Shana, gaadi side mein lo!\""
        ];
        let qIdx = 0;
        setInterval(() => {
            const q = document.getElementById('quote-text');
            q.style.opacity = 0;
            setTimeout(() => {
                qIdx = (qIdx + 1) % quotes.length;
                q.innerText = quotes[qIdx];
                q.style.opacity = 1;
            }, 500);
        }, 5000);

        // Clock
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        // YouTube Engine
        let player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '0', width: '0',
                playerVars: { listType: 'playlist', list: 'PLIqporl42Kfc' },
                events: {
                    'onReady': (e) => player.setVolume(70),
                    'onStateChange': (e) => {
                        const btn = document.getElementById('playBtn');
                        const name = document.getElementById('track-name');
                        if (e.data == 1) {
                            btn.innerText = "⏸";
                            name.innerText = player.getVideoData().title;
                            updateProgress();
                        } else {
                            btn.innerText = "▶";
                        }
                    }
                }
            });
        }

        function updateProgress() {
            setInterval(() => {
                if(player && player.getCurrentTime) {
                    const perc = (player.getCurrentTime() / player.getDuration()) * 100;
                    document.getElementById('progress-bar').style.width = perc + "%";
                }
            }, 1000);
        }

        function togglePlay() {
            if(player.getPlayerState() == 1) player.pauseVideo();
            else player.playVideo();
        }
        function next() { player.nextVideo(); }
        function prev() { player.previousVideo(); }
        function setVol(v) { 
            player.setVolume(v); 
            document.getElementById('volLabel').innerText = v + "%";
        }

        // Spacebar for siren
        window.addEventListener('keydown', (e) => {
            if(e.code === 'Space') { e.preventDefault(); triggerSiren(); }
        });
    </script>
</body>
</html>
